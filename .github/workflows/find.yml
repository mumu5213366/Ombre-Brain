name: find

on:
  schedule:
    - cron: '0 6 * * *'    # 北京约 14:00
    - cron: '0 13 * * *'   # 北京约 21:00
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 找内容
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python find.py
